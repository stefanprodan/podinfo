# Production values for podinfo.
# Includes Redis deployment and memory limits.

replicaCount: 1
logLevel: info
backend: #http://backend-podinfo:9898/echo
backends: []
# gRPC echo backend URLs, grpc://host:port or grpcs://host:port for TLS
grpcBackends: []

image:
  repository: ghcr.io/stefanprodan/podinfo
  tag: 6.17.0
  pullPolicy: IfNotPresent

ui:
  # the background color, blue is "#1f4e8c" and green is "#17694f"
  color: "#1f4e8c"
  message: ""
  logo: ""

# failure conditions
faults:
  delay: false
  error: false
  unhealthy: false
  unready: false
  testFail: false
  testTimeout: false

# Kubernetes Service settings
service:
  enabled: true
  annotations: {}
  additionalLabels: { }
  type: ClusterIP
  metricsPort: 9797
  httpPort: 9898
  externalPort: 9898
  grpcPort: 9999
  grpcService: podinfo
  nodePort: 31198
  trafficDistribution: ""
  externalTrafficPolicy: ""

# enable h2c protocol (non-TLS version of HTTP/2)
h2c:
  enabled: false

# config file settings
config:
  # config file path
  path: ""
  # config file name
  name: ""

# Additional command line arguments to pass to podinfo container
extraArgs: []

# enable tls on the podinfo service
tls:
  enabled: false
  # the name of the secret used to mount the certificate key pair
  secretName:
  # the path where the certificate key pair will be mounted
  certPath: /data/cert
  # the port used to host the tls endpoint on the service
  port: 9899
  # the port used to bind the tls port to the host
  # NOTE: requires privileged container with NET_BIND_SERVICE capability -- this is useful for testing
  # in local clusters such as kind without port forwarding
  hostPort:

# create a certificate manager certificate (cert-manager required)
certificate:
  create: false
  # the issuer used to issue the certificate
  issuerRef:
    kind: ClusterIssuer
    name: self-signed
  # the hostname / subject alternative names for the certificate
  dnsNames:
    - podinfo

# metrics-server add-on required
hpa:
  enabled: true
  maxReplicas: 5
  # average total CPU usage per pod (1-100)
  cpu: 99
  # average memory usage per pod (100Mi-1Gi)
  memory:
  # average http requests per second per pod (k8s-prometheus-adapter)
  requests:

# Redis or Valkey URL in the format redis://<host>:<port>, rediss:// for TLS, valkey:// and valkeys:// as aliases
cache: ""
# cache connection settings
cacheOptions:
  # connect in cluster mode, implied when the URL has more than one address
  cluster: false
  # the name of the primary monitored by Sentinel, the URL addresses are then the Sentinels
  sentinelPrimary: ""
  # the name of the secret with the PODINFO_CACHE_USERNAME, PODINFO_CACHE_PASSWORD and PODINFO_CACHE_SENTINEL_PASSWORD keys
  credentialsSecretName: ""
  # the CA bundle that verifies the server certificate, requires a rediss:// or valkeys:// URL
  ca:
    # the name of the secret holding the CA bundle
    secretName: ""
    # the name of the config map holding the CA bundle
    configMapName: ""
    # the key of the CA bundle in the secret or config map
    key: ca.crt
  # the client key pair presented to the server, a rotated pair is used for new connections, requires a rediss:// or valkeys:// URL
  cert:
    # the name of the kubernetes.io/tls secret holding the tls.crt and tls.key
    secretName: ""
# Redis deployment
redis:
  enabled: true
  repository: redis
  tag: 8.8.0

serviceAccount:
  # Specifies whether a service account should be created
  enabled: false
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:
  # List of image pull secrets if pulling from private registries
  imagePullSecrets: []

# set container security context
securityContext: {}

# set pod security context
podSecurityContext: {}

# -- Expose the service via Kubernetes Ingress
# Requires an Ingress controller
# Docs https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  additionalLabels: {}
  annotations: {}
    # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: podinfo.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- Expose the service via Gateway HTTPRoute
# Requires a Gateway controller
# Docs https://gateway-api.sigs.k8s.io/guides/
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # Add additional labels to the HTTPRoute.
  additionalLabels: {}
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
    - name: gateway
      sectionName: http
      # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
    - podinfo.local
  # List of rules and filters applied.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

# create Prometheus Operator monitor
serviceMonitor:
  enabled: false
  interval: 15s
  additionalLabels: {}

resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 64Mi

# Extra environment variables for the podinfo container; an OTEL_* variable set here replaces the one generated by otel
extraEnvs: []
# Example on how to configure extraEnvs
#  - name: OTEL_METRIC_EXPORT_INTERVAL
#    value: "10000"
#  - name: MULTIPLE_VALUES
#    value: TEST

# export traces, metrics and logs over OTLP
otel:
  enabled: false
  # the OTLP endpoint, e.g. http://otel-collector:4318, required when enabled
  endpoint: ""
  # the OTLP protocol: http/protobuf (default, port 4318) or grpc (port 4317)
  protocol: ""
  # the service name, defaults to the release fullname
  serviceName: ""
  # extra resource attributes, merged over the Kubernetes attributes set from the downward API
  resourceAttributes: {}
  # the traces sampler, e.g. parentbased_traceidratio, defaults to parentbased_always_on
  sampler: ""
  # the sampler argument, e.g. "0.1" for parentbased_traceidratio, requires sampler
  samplerArg: ""

nodeSelector: {}

tolerations: []

affinity: {}

podAnnotations: {}

# https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle#container-probes
probes:
  readiness:
    initialDelaySeconds: 1
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 1
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
    periodSeconds: 10
  startup:
    enable: false
    initialDelaySeconds: 10
    timeoutSeconds: 5
    failureThreshold: 20
    successThreshold: 1
    periodSeconds: 10
