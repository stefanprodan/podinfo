# Production values for podinfo, applied over the chart defaults:
# helm upgrade -i podinfo oci://ghcr.io/stefanprodan/charts/podinfo -f values-prod.yaml
# With Flux valuesFiles, list values.yaml first and this file second.

# metrics-server add-on required
hpa:
  enabled: true
  maxReplicas: 5
  # average total CPU usage per pod
  cpu: 99

# Redis deployment
redis:
  enabled: true

resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 64Mi
