# Default values for podinfo.
# The "@schema" comments feed values.schema.json, regenerate it with "make chart-schema".

nameOverride: ""
fullnameOverride: ""
namespaceOverride: ""

replicaCount: 1 # @schema type:[integer, string];minimum:0
logLevel: info # @schema enum:[debug, info, warn, error, fatal, panic]
# @schema type:[string, null]
host: #0.0.0.0
# @schema type:[string, null]
backend: #http://backend-podinfo:9898/echo
backends: [] # @schema item: string
# gRPC echo backend URLs, grpc://host:port or grpcs://host:port for TLS
grpcBackends: [] # @schema item: string

image:
  repository: ghcr.io/stefanprodan/podinfo
  tag: 6.17.0 # @schema type:[string, number]
  pullPolicy: IfNotPresent # @schema enum:[Always, IfNotPresent, Never]
  pullSecrets: []

prefix: / # @schema type:[string, null]

ui:
  # the background color, blue is "#1f4e8c" and green is "#17694f"
  color: "#1f4e8c" # @schema type:[string, number, boolean]
  message: "" # @schema type:[string, number, boolean]
  logo: ""

# failure conditions
faults:
  delay: false
  error: false
  unhealthy: false
  unready: false
  testFail: false
  testTimeout: false

# Kubernetes Service settings
service:
  enabled: true
  annotations: {} # @schema additionalProperties: true
  additionalLabels: {} # @schema additionalProperties: true
  type: ClusterIP # @schema enum:[ClusterIP, NodePort, LoadBalancer]
  metricsPort: 9797 # @schema type:[integer, string, null];minimum:0;maximum:65535
  httpPort: 9898 # @schema type:[integer, string];minimum:1;maximum:65535
  externalPort: 9898 # @schema type:[integer, string];minimum:1;maximum:65535
  grpcPort: 9999 # @schema type:[integer, string, null];minimum:0;maximum:65535
  grpcService: podinfo
  # serve the gRPC port with TLS using the tls secret, or with SPIFFE mTLS when spiffe.enabled
  # requires tls.enabled
  grpcTLS: false
  nodePort: 31198 # @schema type:[integer, string, null];minimum:0;maximum:65535
  # the port used to bind the http port to the host
  # NOTE: requires privileged container with NET_BIND_SERVICE capability -- this is useful for testing
  # in local clusters such as kind without port forwarding
  # @schema type:[integer, string, null];minimum:0;maximum:65535
  hostPort:
  # Stable from Kubernetes v1.33+ with a value of PreferClose. Additional values are PreferSameZone and PreferSameNode from v1.34+. Empty string means it's disabled.
  trafficDistribution: ""
  externalTrafficPolicy: "" # @schema enum:["", Cluster, Local]

# serve HTTP/2 without TLS (h2c) on the HTTP port
h2c:
  enabled: false

# config file settings
config:
  # config file path
  path: ""
  # config file name
  name: ""

# Additional command line arguments to pass to podinfo container
extraArgs: []

# Extra environment variables for the podinfo container; an OTEL_* variable set here replaces the one generated by otel
extraEnvs: []
# Example on how to configure extraEnvs
#  - name: OTEL_METRIC_EXPORT_INTERVAL
#    value: "10000"
#  - name: MULTIPLE_VALUES
#    value: TEST

# export traces, metrics and logs over OTLP
otel:
  enabled: false
  # the OTLP endpoint, e.g. http://otel-collector:4318, required when enabled
  endpoint: ""
  # the OTLP protocol: http/protobuf (default, port 4318) or grpc (port 4317)
  protocol: "" # @schema enum:["", http/protobuf, grpc]
  # the service name, defaults to the release fullname
  serviceName: ""
  # extra resource attributes, merged over the Kubernetes attributes set from the downward API
  resourceAttributes: {} # @schema additionalProperties: true
  # the traces sampler, e.g. parentbased_traceidratio, defaults to parentbased_always_on
  sampler: "" # @schema enum:["", always_on, always_off, traceidratio, parentbased_always_on, parentbased_always_off, parentbased_traceidratio]
  # the sampler argument, e.g. "0.1" for parentbased_traceidratio, requires sampler
  samplerArg: "" # @schema type:[string, number]

# enable tls on the podinfo service
tls:
  enabled: false
  # the name of the secret used to mount the certificate key pair
  # @schema type:[string, null]
  secretName:
  # the path where the certificate key pair will be mounted
  certPath: /data/cert
  # the port used to host the tls endpoint on the service
  port: 9899 # @schema type:[integer, string];minimum:1;maximum:65535
  # the port used to bind the tls port to the host
  # NOTE: requires privileged container with NET_BIND_SERVICE capability -- this is useful for testing
  # in local clusters such as kind without port forwarding
  # @schema type:[integer, string, null];minimum:0;maximum:65535
  hostPort:

# serve the tls port with SPIFFE mTLS (SPIRE and the SPIFFE CSI driver required)
# the X.509 SVID is fetched from the SPIFFE Workload API instead of the tls secret
# requires tls.enabled for the port and service
spiffe:
  enabled: false
  # the SPIFFE Workload API socket, the socket dir is mounted from the CSI driver
  endpointSocket: unix:///spiffe-workload-api/spire-agent.sock
  # the CSI driver that mounts the Workload API socket
  csiDriver: csi.spiffe.io
  # the client SPIFFE IDs allowed to connect, when empty any ID in podinfo's trust domain is allowed
  # NOTE: the Helm test client runs with podinfo's service account, include its ID when setting this list
  authorizedIDs: [] # @schema item: string
  # call the https and grpcs backends with SPIFFE mTLS, presenting podinfo's SVID
  backendMTLS: false
  # the server SPIFFE IDs accepted from the backends, when empty any ID in podinfo's trust domain is accepted
  # requires backendMTLS
  backendIDs: [] # @schema item: string

# create a certificate manager certificate (cert-manager required)
certificate:
  create: false
  # the issuer used to issue the certificate
  issuerRef: # @schema additionalProperties: true
    kind: ClusterIssuer
    name: self-signed
  # the hostname / subject alternative names for the certificate
  dnsNames: # @schema item: string
    - podinfo

# Helm hooks (for testing purposes)
hooks:
  preInstall:
    job:
      enabled: false
      hookDeletePolicy: hook-succeeded,hook-failed
      ttlSecondsAfterFinished: # @schema type:[integer, null];minimum:0
      sleepSeconds: # @schema type:[integer, null];minimum:0
      exitCode: 0 # @schema type:[integer, null];minimum:0;maximum:255
  postInstall:
    job:
      enabled: false
      hookDeletePolicy: hook-succeeded,hook-failed
      ttlSecondsAfterFinished: # @schema type:[integer, null];minimum:0
      sleepSeconds: # @schema type:[integer, null];minimum:0
      exitCode: 0 # @schema type:[integer, null];minimum:0;maximum:255
  preDelete:
    job:
      enabled: false
      hookDeletePolicy: hook-succeeded,hook-failed
      ttlSecondsAfterFinished: # @schema type:[integer, null];minimum:0
      sleepSeconds: # @schema type:[integer, null];minimum:0
      exitCode: 0 # @schema type:[integer, null];minimum:0;maximum:255
  postDelete:
    job:
      enabled: false
      hookDeletePolicy: hook-succeeded,hook-failed
      ttlSecondsAfterFinished: # @schema type:[integer, null];minimum:0
      sleepSeconds: # @schema type:[integer, null];minimum:0
      exitCode: 0 # @schema type:[integer, null];minimum:0;maximum:255
  preUpgrade:
    job:
      enabled: false
      hookDeletePolicy: hook-succeeded,hook-failed
      ttlSecondsAfterFinished: # @schema type:[integer, null];minimum:0
      sleepSeconds: # @schema type:[integer, null];minimum:0
      exitCode: 0 # @schema type:[integer, null];minimum:0;maximum:255
  postUpgrade:
    job:
      enabled: false
      hookDeletePolicy: hook-succeeded,hook-failed
      ttlSecondsAfterFinished: # @schema type:[integer, null];minimum:0
      sleepSeconds: # @schema type:[integer, null];minimum:0
      exitCode: 0 # @schema type:[integer, null];minimum:0;maximum:255
  preRollback:
    job:
      enabled: false
      hookDeletePolicy: hook-succeeded,hook-failed
      ttlSecondsAfterFinished: # @schema type:[integer, null];minimum:0
      sleepSeconds: # @schema type:[integer, null];minimum:0
      exitCode: 0 # @schema type:[integer, null];minimum:0;maximum:255
  postRollback:
    job:
      enabled: false
      hookDeletePolicy: hook-succeeded,hook-failed
      ttlSecondsAfterFinished: # @schema type:[integer, null];minimum:0
      sleepSeconds: # @schema type:[integer, null];minimum:0
      exitCode: 0 # @schema type:[integer, null];minimum:0;maximum:255

# metrics-server add-on required
hpa:
  enabled: false
  maxReplicas: 10 # @schema minimum:1
  # average total CPU usage per pod (1-100)
  cpu: # @schema type:[integer, null];minimum:1
  # average memory usage per pod (100Mi-1Gi)
  memory: # @schema type:[string, integer, null]
  # average http requests per second per pod (k8s-prometheus-adapter)
  requests: # @schema type:[string, number, null]

# Redis or Valkey URL in the format redis://<host>:<port>, rediss:// for TLS, valkey:// and valkeys:// as aliases
cache: ""
# cache connection settings
cacheOptions:
  # connect in cluster mode, implied when the URL has more than one address
  cluster: false
  # the name of the primary monitored by Sentinel, the URL addresses are then the Sentinels
  sentinelPrimary: ""
  # the name of the secret with the PODINFO_CACHE_USERNAME, PODINFO_CACHE_PASSWORD and PODINFO_CACHE_SENTINEL_PASSWORD keys
  credentialsSecretName: ""
  # the CA bundle that verifies the server certificate, requires a rediss:// or valkeys:// URL
  ca:
    # the name of the secret holding the CA bundle
    secretName: ""
    # the name of the config map holding the CA bundle
    configMapName: ""
    # the key of the CA bundle in the secret or config map
    key: ca.crt
  # the client key pair presented to the server, a rotated pair is used for new connections, requires a rediss:// or valkeys:// URL
  cert:
    # the name of the kubernetes.io/tls secret holding the tls.crt and tls.key
    secretName: ""
# Redis deployment
redis:
  enabled: false
  repository: docker.io/redis
  tag: 8.8.0 # @schema type:[string, number]
  imagePullSecrets: []
  # serve Redis over mutual TLS, podinfo presents a client certificate (cert-manager required)
  tls:
    enabled: false
    # the CA issuer that signs the Redis and podinfo certificates, a CA created by the chart when empty
    issuerRef: {} # @schema additionalProperties: true
    # the lifetime of the Redis server certificate, Redis reads it only at startup
    duration: 8760h

serviceAccount:
  # Specifies whether a service account should be created
  enabled: false
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: # @schema type:[string, null]
  # List of image pull secrets if pulling from private registries
  imagePullSecrets: []

# set container security context
securityContext: {} # @schema additionalProperties: true

# set pod security context
podSecurityContext: {} # @schema additionalProperties: true

# -- Expose the service via Kubernetes Ingress
# Requires an Ingress controller
# Docs https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  additionalLabels: {} # @schema additionalProperties: true
  annotations: {} # @schema additionalProperties: true
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: podinfo.local
      paths:
        - path: /
          pathType: ImplementationSpecific # @schema enum:[Exact, Prefix, ImplementationSpecific]
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- Expose the service via Gateway HTTPRoute
# Requires a Gateway controller
# Docs https://gateway-api.sigs.k8s.io/guides/
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # Add additional labels to the HTTPRoute.
  additionalLabels: {} # @schema additionalProperties: true
  # HTTPRoute annotations.
  annotations: {} # @schema additionalProperties: true
  # Which Gateways this Route is attached to.
  parentRefs:
    - {name: gateway, sectionName: http} # @schema additionalProperties: true
  # Hostnames matching HTTP header.
  hostnames: # @schema item: string
    - podinfo.local
  # List of rules and filters applied.
  rules:
    - {matches: [{path: {type: PathPrefix, value: /}}]} # @schema skipProperties: true;additionalProperties: true

# -- Expose the gRPC service via Gateway GRPCRoute
# Requires a Gateway controller with GRPCRoute support
# Docs https://gateway-api.sigs.k8s.io/guides/grpc-routing/
grpcRoute:
  # GRPCRoute enabled.
  enabled: false
  # Add additional labels to the GRPCRoute.
  additionalLabels: {} # @schema additionalProperties: true
  # GRPCRoute annotations.
  annotations: {} # @schema additionalProperties: true
  # Which Gateways this Route is attached to.
  parentRefs:
    - {name: gateway, sectionName: http} # @schema additionalProperties: true
  # Hostnames matching HTTP header.
  hostnames: # @schema item: string
    - podinfo.local
  # List of rules applied.
  rules:
    - {} # @schema additionalProperties: true

# create Prometheus Operator monitor
serviceMonitor:
  enabled: false
  interval: 15s
  additionalLabels: {} # @schema additionalProperties: true

resources: # @schema skipProperties: true;additionalProperties: true
  limits:
  requests:
    cpu: 1m
    memory: 16Mi

nodeSelector: {} # @schema additionalProperties: true

tolerations: []

affinity: {} # @schema additionalProperties: true

priorityClassName: ""

podAnnotations: {} # @schema additionalProperties: true

# https://kubernetes.io/docs/concepts/workloads/pods/pod-topology-spread-constraints/
topologySpreadConstraints: []

# Disruption budget will be configured only when the replicaCount is greater than 1
podDisruptionBudget: {} # @schema additionalProperties: true
#  maxUnavailable: 1

# https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle#container-probes
probes:
  readiness:
    initialDelaySeconds: 1
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
    periodSeconds: 10
  liveness:
    initialDelaySeconds: 1
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1
    periodSeconds: 10
  startup:
    enable: false
    initialDelaySeconds: 10
    timeoutSeconds: 5
    failureThreshold: 20
    successThreshold: 1
    periodSeconds: 10
