name: e2e

on:
  pull_request:
  push:
    branches:
      - 'master'

permissions:
  contents: read

jobs:
  kind-helm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Disk Cleanup
        uses: ./.github/actions/runner-cleanup
      - name: Setup Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.2.4
      - name: Setup Kubernetes
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: kind
      - name: Run integration tests
        run: ./test/e2e.sh
      - name: Debug failure
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl logs -l 'app.kubernetes.io/name in (podinfo,podinfo-valkey)' --prefix --tail=100 --max-log-requests=10 || true
  kind-spiffe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Disk Cleanup
        uses: ./.github/actions/runner-cleanup
      - name: Setup Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.2.4
      - name: Setup Kubernetes
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: kind
      - name: Run SPIFFE integration tests
        run: ./test/e2e-spiffe.sh
  kind-otel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Disk Cleanup
        uses: ./.github/actions/runner-cleanup
      - name: Setup Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.2.4
      - name: Setup Timoni
        uses: stefanprodan/timoni/actions/setup@58f38054cc5276178b1426fabaf0b5e066c7c271 # v0.38.0
      - name: Setup Kubernetes
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: kind
      - name: Run OpenTelemetry integration tests
        run: ./test/e2e-otel.sh
  kind-timoni:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    env:
      PODINFO_IMAGE_URL: "test/podinfo"
      PODINFO_MODULE_URL: "oci://localhost:5000/podinfo"
      PODINFO_VERSION: "0.0.0-devel"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/runner-cleanup
      - name: Setup Timoni
        uses: stefanprodan/timoni/actions/setup@58f38054cc5276178b1426fabaf0b5e066c7c271 # v0.38.0
      - name: Setup Kubernetes
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: kind
      - name: Build container
        run: |
          docker build -t ${PODINFO_IMAGE_URL}:${PODINFO_VERSION} --build-arg "REVISION=${GITHUB_SHA}"  -f Dockerfile .
          kind load docker-image ${PODINFO_IMAGE_URL}:${PODINFO_VERSION}
      - name: Vet module
        run: |
          timoni mod vet ./timoni/podinfo --debug
      - name: Build module
        run: |
          timoni mod push ./timoni/podinfo ${PODINFO_MODULE_URL} -v ${PODINFO_VERSION}
      - name: Install Redis
        run: |
          kubectl create namespace podinfo
          kubectl -n podinfo apply -k ./deploy/bases/cache
          kubectl -n podinfo rollout status deployment/cache --timeout=2m
      - name: Apply bundle
        run: |
          timoni bundle apply -f ./timoni/bundles/test.podinfo.cue --runtime-from-env
      - name: Verify status
        run: |
          timoni -n podinfo status backend
          timoni -n podinfo status frontend
      - name: Verify cache
        run: |
          kubectl -n podinfo exec deploy/backend -- curl -sfd data localhost:9898/cache/e2e
          kubectl -n podinfo exec deploy/backend -- curl -sf localhost:9898/cache/e2e | grep data
      - name: Debug failure
        if: failure()
        run: |
          kubectl -n podinfo get all || true
