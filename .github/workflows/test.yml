name: test

on:
  pull_request:
  push:
    branches:
      - 'master'

permissions:
  contents: read

env:
  HELM_VERSION: 4.2.4

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/runner-cleanup
      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.27.x
          cache-dependency-path: |
            **/go.sum
            **/go.mod
      - name: Setup Flux Schema CLI
        uses: fluxcd/flux-schema/actions/setup@f4ef1813dc8e5388c0f56bc16d7fe16ecfc0e023 # v0.18.0
      - name: Setup Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v${{ env.HELM_VERSION }}
      - name: Setup Timoni
        uses: stefanprodan/timoni/actions/setup@58f38054cc5276178b1426fabaf0b5e066c7c271 # v0.38.0
      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        with:
          version: 2.6.8
      - name: Setup Buf
        uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          version: 1.75.0
          setup_only: true
      - name: Run unit tests
        run: make test
      - name: Lint UI
        run: make ui-lint
      - name: Lint protos
        run: make proto-lint
      - name: Check gRPC stubs
        run: make proto && git diff --exit-code pkg/api/grpc
      - name: Check Helm chart schema
        run: make chart-schema && git diff --exit-code charts/podinfo
      - name: Check Swagger spec
        run: make swagger && git diff --exit-code pkg/api/http/docs && test -z "$(git status --porcelain pkg/api/http/docs)"
      - name: Check Swagger UI
        run: make swagger-ui && git diff --exit-code ui/swagger/dist && test -z "$(git status --porcelain ui/swagger/dist)"
      - name: Validate Helm chart
        run: |
          helm lint ./charts/podinfo/
          helm lint ./charts/podinfo/ -f ./charts/podinfo/values-prod.yaml
          helm template ./charts/podinfo/ | flux-schema validate -s ecosystem --verbose
          helm template ./charts/podinfo/ -f ./charts/podinfo/values-prod.yaml | flux-schema validate -s ecosystem --verbose
      - name: Validate Kustomize overlay
        run: |
          kubectl kustomize ./kustomize/ | flux-schema validate -s ecosystem --verbose
      - name: Verify CUE formatting
        working-directory: ./timoni/podinfo
        run: timoni fmt --diff
      - name: Validate Timoni module
        working-directory: ./timoni/podinfo
        run: |
          timoni mod vet .
          timoni build podinfo . -f debug_values.cue | flux-schema validate -s ecosystem --verbose
      - name: Check if working tree is dirty
        run: |
          if [[ $(git diff --stat) != '' ]]; then
            echo 'run make test and commit changes'
            exit 1
          fi
