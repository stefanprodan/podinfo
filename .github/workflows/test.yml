name: test

on:
  pull_request:
  push:
    branches:
      - 'master'

permissions:
  contents: read

env:
  HELM_VERSION: 4.2.4

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/runner-cleanup
      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: 1.27.x
          cache-dependency-path: |
            **/go.sum
            **/go.mod
      - name: Setup Flux Schema CLI
        uses: fluxcd/flux-schema/actions/setup@4c71b2098ba84b738d811877463f5a2b2bfe443f # v0.17.0
      - name: Setup Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v${{ env.HELM_VERSION }}
      - name: Setup Timoni
        uses: stefanprodan/timoni/actions/setup@40e1054b478fe15a8887fb8f22eb42c4a9da04f8 # v0.37.0
      - name: Run unit tests
        run: make test
      - name: Validate Helm chart
        run: |
          helm lint ./charts/podinfo/
          helm template ./charts/podinfo/ | flux-schema validate -s ecosystem --verbose
      - name: Validate Kustomize overlay
        run: |
          kubectl kustomize ./kustomize/ | flux-schema validate -s ecosystem --verbose
      - name: Verify CUE formatting
        working-directory: ./timoni/podinfo
        run: timoni fmt --diff
      - name: Validate Timoni module
        working-directory: ./timoni/podinfo
        run: |
          timoni mod vet .
          timoni build podinfo . -f debug_values.cue | flux-schema validate -s ecosystem --verbose
      - name: Check if working tree is dirty
        run: |
          if [[ $(git diff --stat) != '' ]]; then
            echo 'run make test and commit changes'
            exit 1
          fi
