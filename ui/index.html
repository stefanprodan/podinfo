<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <link rel="icon" type="image/svg+xml" href="{{.Prefix}}/ui/favicon.svg">
  <link rel="stylesheet" href="{{.Prefix}}/ui/podinfo.css">
  <script src="{{.Prefix}}/ui/podinfo.js" defer></script>
</head>
<body data-prefix="{{.Prefix}}">
  <main class="hero">
    <img class="logo" src="{{.Logo}}" height="350" alt="">
    <h1 class="message"></h1>
    <div class="served">Served by <b class="hostname"></b></div>
    <button class="ping" type="button">
      <span class="icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11.24V7.5C9 6.12 10.12 5 11.5 5S14 6.12 14 7.5v3.74c1.21-.81 2-2.18 2-3.74C16 5.01 13.99 3 11.5 3S7 5.01 7 7.5c0 1.56.79 2.93 2 3.74zm9.84 4.63l-4.54-2.26c-.17-.07-.35-.11-.54-.11H13v-6c0-.83-.67-1.5-1.5-1.5S10 6.67 10 7.5v10.74l-3.43-.72c-.08-.01-.15-.03-.24-.03-.31 0-.59.13-.79.33l-.79.8 4.94 4.94c.27.27.65.44 1.06.44h6.79c.75 0 1.33-.55 1.44-1.28l.75-5.27c.01-.07.02-.14.02-.2 0-.62-.38-1.16-.91-1.38z"/></svg>
        <span class="badge" role="status">0</span>
      </span>
      Ping
    </button>
    <ul class="timeline">
      <li><span class="dot"></span><h3></h3></li>
      <li><span class="dot"></span><h3></h3></li>
    </ul>
  </main>
  <footer>
    Powered by <a href="https://github.com/stefanprodan/podinfo" target="_blank" rel="noopener">podinfo</a>
    version <span class="version"></span> revision <span class="revision"></span>
    Swagger <a href="{{.Prefix}}/swagger/">docs</a>
  </footer>
</body>
</html>
