<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<meta name="description" content="podinfo, a demo microservice for Kubernetes: https://github.com/stefanprodan/podinfo">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f4e8c">
<link rel="icon" type="image/png" href="{{.Prefix}}/ui/favicon.png">
<link rel="apple-touch-icon" href="{{.Prefix}}/ui/apple-touch-icon.png">
<link rel="stylesheet" href="{{.Prefix}}/ui/podinfo.css">
<script src="{{.Prefix}}/ui/podinfo.js" defer></script>
</head>
<body data-prefix="{{.Prefix}}">
<main class="poster">
  <div class="bubbles" aria-hidden="true"></div>
  <p class="announcer sr" role="status"></p>
  <p class="greeting"><span class="message"></span> <span class="build">revision <span class="revision"></span></span></p>
  <div class="deck">
    <div class="stage">
      <div class="id">
        <div class="clip"><h1 class="version"></h1></div>
        <p class="served up"><span class="pulse" aria-hidden="true"></span>Served by <b class="hostname"></b></p>
        <p class="served lost" hidden><span class="pulse" aria-hidden="true"></span>No response since <b class="since"></b>, retrying</p>
      </div>
      <img class="logo" src="{{.Logo}}" alt="">
    </div>
    <div class="share">
      <div class="bar" aria-hidden="true"></div>
      <ul class="labels"></ul>
    </div>
    <section class="details" id="details" aria-label="Pod details" inert>
      <article class="sheet" tabindex="-1">
        <header class="top">
          <div>
            <h2 class="host"></h2>
            <dl class="facts"></dl>
            <p class="offline" hidden>No response since <b class="since"></b>, retrying</p>
          </div>
          <div class="stamp" role="img"><div aria-hidden="true"><b></b><span>podinfo</span></div></div>
        </header>
        <div class="cols">
          <section class="col" aria-labelledby="env-title">
            <h2 id="env-title">Environment <span></span></h2>
            <dl class="lines" id="env"></dl>
          </section>
          <section class="col" aria-labelledby="headers-title">
            <h2 id="headers-title">Request headers <span></span></h2>
            <dl class="lines" id="headers"></dl>
          </section>
        </div>
      </article>
    </section>
  </div>
  <div class="foot">
    <button class="ping" type="button"><span>Ping</span><span class="fill" aria-hidden="true">Ping</span></button>
    <span class="pings" role="status"></span>
    <button class="flip" type="button" aria-controls="details" aria-expanded="false" aria-label="Pod details" title="Pod details">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10.5"/><path d="M12 11v6"/><path d="M12 7.2h.01" stroke-width="2.6"/></svg>
    </button>
    <a href="{{.Prefix}}/swagger/" aria-label="Swagger API docs" title="Swagger API docs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10.5"/><path d="M9.6 6.9c-1.4 0-1.9.6-1.9 1.8v1.4c0 .9-.4 1.5-1.4 1.9 1 .4 1.4 1 1.4 1.9v1.4c0 1.2.5 1.8 1.9 1.8M14.4 6.9c1.4 0 1.9.6 1.9 1.8v1.4c0 .9.4 1.5 1.4 1.9-1 .4-1.4 1-1.4 1.9v1.4c0 1.2-.5 1.8-1.9 1.8"/><path d="M10.2 12h.01M12 12h.01M13.8 12h.01" stroke-width="1.6"/></svg>
    </a>
    <a href="https://github.com/stefanprodan/podinfo" target="_blank" rel="noopener" aria-label="podinfo on GitHub" title="podinfo on GitHub">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
  </div>
</main>
</body>
</html>
