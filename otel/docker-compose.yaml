services:
  frontend:
    build: ..
    command: ./podinfo --level debug --grpc-port 9999 --backend-url http://backend:9898/echo --grpc-backend-url grpc://backend:9999
    environment:
      OTEL_SERVICE_NAME: frontend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
    ports:
      - "9898:9898"
      - "9999:9999"
    depends_on:
      - backend
  backend:
    build: ..
    command: ./podinfo --level debug --grpc-port 9999
    environment:
      OTEL_SERVICE_NAME: backend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
    depends_on:
      - lgtm
  lgtm:
    image: grafana/otel-lgtm:0.41.1
    ports:
      - "3000:3000"
    volumes:
      - ./grafana-datasources.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/podinfo.yaml:ro
