basePath: /
definitions:
  http.ErrorMessage:
    properties:
      code:
        type: integer
      message:
        type: string
    type: object
  http.MapResponse:
    additionalProperties:
      type: string
    type: object
  http.PodResponse:
    properties:
      env:
        additionalProperties:
          type: string
        type: object
      goarch:
        type: string
      goos:
        type: string
      headers:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
      hostname:
        type: string
      num_cpu:
        type: string
      num_goroutine:
        type: string
      revision:
        type: string
      runtime:
        type: string
      version:
        type: string
    type: object
  http.RuntimeResponse:
    properties:
      color:
        type: string
      goarch:
        type: string
      goos:
        type: string
      hostname:
        type: string
      logo:
        type: string
      message:
        type: string
      num_cpu:
        type: string
      num_goroutine:
        type: string
      revision:
        type: string
      runtime:
        type: string
      version:
        type: string
    type: object
  http.TokenResponse:
    properties:
      expires_at:
        type: string
      token:
        type: string
    type: object
  http.TokenValidationResponse:
    properties:
      expires_at:
        type: string
      token_name:
        type: string
    type: object
info:
  contact:
    name: Source Code
    url: https://github.com/stefanprodan/podinfo
  description: Go microservice template for Kubernetes.
  license:
    name: Apache License 2.0
    url: https://github.com/stefanprodan/podinfo/blob/master/LICENSE
  title: Podinfo API
  version: "2.0"
paths:
  /:
    get:
      description: renders podinfo UI when the User-Agent starts with Mozilla, other
        clients get the runtime information of /api/info as JSON
      produces:
      - text/html
      - application/json
      responses:
        "200":
          description: HTML page
          schema:
            type: string
        "500":
          description: rendering the page failed
          schema:
            type: string
      summary: Index
      tags:
      - HTTP API
  /api/echo:
    post:
      consumes:
      - application/json
      - text/plain
      - application/octet-stream
      description: echos the posted content, or when backend URLs are set posts it
        to each backend and returns their responses
      parameters:
      - description: content to echo
        in: body
        name: payload
        schema:
          type: string
      produces:
      - application/octet-stream
      - application/json
      responses:
        "200":
          description: the response or the error of each backend
          schema:
            items:
              type: string
            type: array
        "202":
          description: the posted content, without backends
          schema:
            type: file
        "400":
          description: invalid request body
          schema:
            $ref: '#/definitions/http.ErrorMessage'
        "413":
          description: request body too large
          schema:
            $ref: '#/definitions/http.ErrorMessage'
        "499":
          description: client closed request
          schema:
            $ref: '#/definitions/http.ErrorMessage'
      summary: Echo
      tags:
      - HTTP API
  /api/info:
    get:
      description: returns the runtime information
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.RuntimeResponse'
      summary: Runtime information
      tags:
      - HTTP API
  /api/pod:
    get:
      description: returns the runtime information, the environment variables and
        the request HTTP headers of the pod that served the request, with secret values
        masked, plus X-Spiffe-Id when the client presented a SPIFFE X.509 SVID
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.PodResponse'
      summary: Pod runtime, environment and request headers
      tags:
      - HTTP API
  /artifact:
    get:
      description: returns the files from the artifact path as a tar.gz with its sha256
        digest in the X-Artifact-Digest header, the route exists only when the artifact
        path is set
      produces:
      - application/gzip
      - application/json
      responses:
        "200":
          description: tar.gz archive, no body for HEAD
          schema:
            type: file
        "404":
          description: artifact not found
          schema:
            $ref: '#/definitions/http.ErrorMessage'
      summary: Download artifact
      tags:
      - HTTP API
    head:
      description: returns the files from the artifact path as a tar.gz with its sha256
        digest in the X-Artifact-Digest header, the route exists only when the artifact
        path is set
      produces:
      - application/gzip
      - application/json
      responses:
        "200":
          description: tar.gz archive, no body for HEAD
          schema:
            type: file
        "404":
          description: artifact not found
          schema:
            $ref: '#/definitions/http.ErrorMessage'
      summary: Download artifact
      tags:
      - HTTP API
  /cache/{key}:
    delete:
      description: deletes the key and its value from cache
      parameters:
      - description: Key to delete
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
        "400":
          description: key too long
          schema:
            $ref: '#/definitions/http.ErrorMessage'
        "499":
          description: client closed request
          schema:
            $ref: '#/definitions/http.ErrorMessage'
        "500":
          description: cache delete failed
          schema:
            $ref: '#/definitions/http.ErrorMessage'
        "503":
          description: cache server not configured
          schema:
            $ref: '#/definitions/http.ErrorMessage'
      summary: Delete payload from cache
      tags:
      - HTTP API
    get:
      description: returns the content from cache if key exists
      parameters:
      - description: Key to load from cache
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/octet-stream
      - application/json
      responses:
        "200":
          description: value
          schema:
            type: file
        "400":
          description: key too long
          schema:
            $ref: '#/definitions/http.ErrorMessage'
        "404":
          description: key not found
        "499":
          description: client closed request
          schema:
            $ref: '#/definitions/http.ErrorMessage'
        "500":
          description: cache get failed
          schema:
            $ref: '#/definitions/http.ErrorMessage'
        "503":
          description: cache server not configured
          schema:
            $ref: '#/definitions/http.ErrorMessage'
      summary: Get payload from cache
      tags:
      - HTTP API
    post:
      consumes:
      - application/json
      - text/plain
      - application/octet-stream
      description: writes the posted content in cache
      parameters:
      - description: Key to save to
        in: path
        name: key
        required: true
        type: string
      - description: content to save
        in: body
        name: payload
        schema:
          type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
        "400":
          description: invalid request body or key too long
          schema:
            $ref: '#/definitions/http.ErrorMessage'
        "413":
          description: request body too large
          schema:
            $ref: '#/definitions/http.ErrorMessage'
        "499":
          description: client closed request
          schema:
            $ref: '#/definitions/http.ErrorMessage'
        "500":
          description: cache set failed
          schema:
            $ref: '#/definitions/http.ErrorMessage'
        "503":
          description: cache server not configured
          schema:
            $ref: '#/definitions/http.ErrorMessage'
      summary: Save payload in cache
      tags:
      - HTTP API
    put:
      consumes:
      - application/json
      - text/plain
      - application/octet-stream
      description: writes the posted content in cache
      parameters:
      - description: Key to save to
        in: path
        name: key
        required: true
        type: string
      - description: content to save
        in: body
        name: payload
        schema:
          type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
        "400":
          description: invalid request body or key too long
          schema:
            $ref: '#/definitions/http.ErrorMessage'
        "413":
          description: request body too large
          schema:
            $ref: '#/definitions/http.ErrorMessage'
        "499":
          description: client closed request
          schema:
            $ref: '#/definitions/http.ErrorMessage'
        "500":
          description: cache set failed
          schema:
            $ref: '#/definitions/http.ErrorMessage'
        "503":
          description: cache server not configured
          schema:
            $ref: '#/definitions/http.ErrorMessage'
      summary: Save payload in cache
      tags:
      - HTTP API
  /chunked/{seconds}:
    get:
      description: sends the response headers with transfer-encoding chunked, waits
        for the specified period, then sends the body
      parameters:
      - description: seconds to wait for
        in: path
        name: seconds
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: the delay in seconds
          schema:
            additionalProperties:
              type: integer
            type: object
        "400":
          description: invalid request body
          schema:
            $ref: '#/definitions/http.ErrorMessage'
        "413":
          description: request body too large
          schema:
            $ref: '#/definitions/http.ErrorMessage'
        "500":
          description: Streaming unsupported!
          schema:
            $ref: '#/definitions/http.ErrorMessage'
      summary: Chunked transfer encoding
      tags:
      - HTTP API
  /configs:
    get:
      description: returns the files in the config path as a JSON object of file name
        to content, empty when the config path is not a directory
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Config files
      tags:
      - HTTP API
  /delay/{seconds}:
    get:
      description: waits for the specified period
      parameters:
      - description: seconds to wait for
        in: path
        name: seconds
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: the delay in seconds
          schema:
            additionalProperties:
              type: integer
            type: object
        "400":
          description: invalid delay or request body
          schema:
            $ref: '#/definitions/http.ErrorMessage'
        "413":
          description: request body too large
          schema:
            $ref: '#/definitions/http.ErrorMessage'
        "499":
          description: client closed request
          schema:
            $ref: '#/definitions/http.ErrorMessage'
      summary: Delay
      tags:
      - HTTP API
  /echo:
    post:
      consumes:
      - application/json
      - text/plain
      - application/octet-stream
      description: echos the posted content, or when backend URLs are set posts it
        to each backend and returns their responses
      parameters:
      - description: content to echo
        in: body
        name: payload
        schema:
          type: string
      produces:
      - application/octet-stream
      - application/json
      responses:
        "200":
          description: the response or the error of each backend
          schema:
            items:
              type: string
            type: array
        "202":
          description: the posted content, without backends
          schema:
            type: file
        "400":
          description: invalid request body
          schema:
            $ref: '#/definitions/http.ErrorMessage'
        "413":
          description: request body too large
          schema:
            $ref: '#/definitions/http.ErrorMessage'
        "499":
          description: client closed request
          schema:
            $ref: '#/definitions/http.ErrorMessage'
      summary: Echo
      tags:
      - HTTP API
  /env:
    get:
      description: returns the environment variables as a JSON array, with secret
        values masked
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
      summary: Environment
      tags:
      - HTTP API
    post:
      description: returns the environment variables as a JSON array, with secret
        values masked
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
      summary: Environment
      tags:
      - HTTP API
  /fault_injection/disable:
    post:
      description: restores normal responses
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Disable fault injection
      tags:
      - Fault Injection
  /fault_injection/enable:
    post:
      description: makes the server respond with HTTP 500 and a JSON body on all endpoints
        except the probes, the metrics, pprof and the fault injection ones
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Enable fault injection
      tags:
      - Fault Injection
  /fault_injection/status:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get fault injection status
      tags:
      - Fault Injection
  /headers:
    get:
      description: returns the request HTTP headers as a JSON object of name to list
        of values, with credential values masked, plus X-Spiffe-Id when the client
        presented a SPIFFE X.509 SVID
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                type: string
              type: array
            type: object
      summary: Headers
      tags:
      - HTTP API
    post:
      description: returns the request HTTP headers as a JSON object of name to list
        of values, with credential values masked, plus X-Spiffe-Id when the client
        presented a SPIFFE X.509 SVID
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                type: string
              type: array
            type: object
      summary: Headers
      tags:
      - HTTP API
  /healthz:
    get:
      description: used by Kubernetes liveness probe
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: unhealthy
      summary: Liveness check
      tags:
      - Kubernetes
  /metrics:
    get:
      description: returns HTTP requests duration and Go runtime metrics
      produces:
      - text/plain
      responses:
        "200":
          description: metrics in the Prometheus text format
          schema:
            type: string
        "500":
          description: gathering the metrics failed
          schema:
            type: string
      summary: Prometheus metrics
      tags:
      - Kubernetes
  /panic:
    get:
      description: crashes the process with exit code 255
      responses: {}
      summary: Panic
      tags:
      - HTTP API
  /readyz:
    get:
      description: used by Kubernetes readiness probe
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: not ready
      summary: Readiness check
      tags:
      - Kubernetes
  /readyz/disable:
    post:
      description: makes the readiness check fail, so Kubernetes stops sending traffic
        to this instance
      responses:
        "202":
          description: Accepted
      summary: Disable ready state
      tags:
      - Kubernetes
  /readyz/enable:
    post:
      description: makes the readiness check pass, so Kubernetes sends traffic to
        this instance
      responses:
        "202":
          description: Accepted
      summary: Enable ready state
      tags:
      - Kubernetes
  /status/{code}:
    get:
      description: sets the response status code to the specified code, 204 and 304
        have no body
      parameters:
      - description: status code to return, 200 to 999
        in: path
        name: code
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "400":
          description: invalid status code
          schema:
            $ref: '#/definitions/http.ErrorMessage'
        default:
          description: the specified status code
          schema:
            additionalProperties:
              type: integer
            type: object
      summary: Status code
      tags:
      - HTTP API
    post:
      description: sets the response status code to the specified code, 204 and 304
        have no body
      parameters:
      - description: status code to return, 200 to 999
        in: path
        name: code
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "400":
          description: invalid status code
          schema:
            $ref: '#/definitions/http.ErrorMessage'
        default:
          description: the specified status code
          schema:
            additionalProperties:
              type: integer
            type: object
      summary: Status code
      tags:
      - HTTP API
    put:
      description: sets the response status code to the specified code, 204 and 304
        have no body
      parameters:
      - description: status code to return, 200 to 999
        in: path
        name: code
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "400":
          description: invalid status code
          schema:
            $ref: '#/definitions/http.ErrorMessage'
        default:
          description: the specified status code
          schema:
            additionalProperties:
              type: integer
            type: object
      summary: Status code
      tags:
      - HTTP API
  /store:
    post:
      consumes:
      - application/json
      - text/plain
      - application/octet-stream
      description: writes the posted content to a file named by its SHA1 hash in the
        data path and returns the hash
      parameters:
      - description: content to store
        in: body
        name: payload
        schema:
          type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/http.MapResponse'
        "400":
          description: invalid request body
          schema:
            $ref: '#/definitions/http.ErrorMessage'
        "413":
          description: request body too large
          schema:
            $ref: '#/definitions/http.ErrorMessage'
        "500":
          description: writing file failed
          schema:
            $ref: '#/definitions/http.ErrorMessage'
      summary: Upload file
      tags:
      - HTTP API
    put:
      consumes:
      - application/json
      - text/plain
      - application/octet-stream
      description: writes the posted content to a file named by its SHA1 hash in the
        data path and returns the hash
      parameters:
      - description: content to store
        in: body
        name: payload
        schema:
          type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/http.MapResponse'
        "400":
          description: invalid request body
          schema:
            $ref: '#/definitions/http.ErrorMessage'
        "413":
          description: request body too large
          schema:
            $ref: '#/definitions/http.ErrorMessage'
        "500":
          description: writing file failed
          schema:
            $ref: '#/definitions/http.ErrorMessage'
      summary: Upload file
      tags:
      - HTTP API
  /store/{hash}:
    get:
      description: returns the content of the file named by the hash in the data path
      parameters:
      - description: SHA1 hash of the content
        in: path
        name: hash
        required: true
        type: string
      produces:
      - application/octet-stream
      - application/json
      responses:
        "200":
          description: file content
          schema:
            type: file
        "400":
          description: invalid hash
          schema:
            $ref: '#/definitions/http.ErrorMessage'
        "404":
          description: file not found
          schema:
            $ref: '#/definitions/http.ErrorMessage'
        "500":
          description: reading file failed
          schema:
            $ref: '#/definitions/http.ErrorMessage'
      summary: Download file
      tags:
      - HTTP API
  /token:
    post:
      consumes:
      - text/plain
      description: issues a JWT token valid for one minute for the name in the request
        body, anonymous when empty
      parameters:
      - description: name set in the token
        in: body
        name: name
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.TokenResponse'
        "400":
          description: invalid request body
          schema:
            $ref: '#/definitions/http.ErrorMessage'
        "413":
          description: request body too large
          schema:
            $ref: '#/definitions/http.ErrorMessage'
        "500":
          description: token signing failed
          schema:
            $ref: '#/definitions/http.ErrorMessage'
      summary: Generate JWT token
      tags:
      - HTTP API
  /token/validate:
    get:
      description: validates the JWT token and returns its name and expiry
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.TokenValidationResponse'
        "401":
          description: invalid or missing token
          schema:
            $ref: '#/definitions/http.ErrorMessage'
      summary: Validate JWT token
      tags:
      - HTTP API
  /version:
    get:
      description: returns podinfo version and git commit hash
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.MapResponse'
      summary: Version
      tags:
      - HTTP API
  /ws/echo:
    get:
      description: upgrades the connection to a websocket, answers each message with
        a JSON message holding the time and the content, and sends the hostname every
        five seconds
      produces:
      - text/plain
      responses:
        "101":
          description: Switching Protocols
        "400":
          description: not a websocket handshake
          schema:
            type: string
        "403":
          description: request origin not allowed
          schema:
            type: string
        "426":
          description: websocket not found in the Upgrade header
          schema:
            type: string
      summary: Echo over websockets
      tags:
      - HTTP API
schemes:
- http
- https
swagger: "2.0"
