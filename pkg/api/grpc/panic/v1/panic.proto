syntax = "proto3";

package panic.v1;

option go_package = "github.com/stefanprodan/podinfo/pkg/api/grpc/panic/v1;panicv1";

// Panic exits the process with code 225, to test how a crash is handled.
service PanicService {
  rpc Panic(PanicRequest) returns (PanicResponse) {}
}

message PanicRequest {}

message PanicResponse {}
